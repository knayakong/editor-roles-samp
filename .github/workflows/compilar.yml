# Compila EditorRoles.exe en las máquinas de GitHub, a partir de este código, con el mismo compilar.bat.
# Al publicar una versión (tag v*): adjunta un sello de origen verificable y crea el Release.
# Probar sin publicar: pestaña Actions → "Compilar y publicar" → Run workflow.
name: Compilar y publicar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # crear el Release
  id-token: write      # firmar el sello de origen
  attestations: write  # guardar el sello

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar con el compilador que trae Windows
        shell: cmd
        run: compilar.bat < NUL

      - name: Comprobar que se generó el .exe
        shell: pwsh
        run: |
          if (!(Test-Path EditorRoles.exe)) { throw "No se generó EditorRoles.exe" }
          Get-Item EditorRoles.exe | Select-Object Name, Length

      - name: Empaquetar y calcular SHA256
        shell: pwsh
        run: |
          Copy-Item LICENSE LICENSE.txt
          Compress-Archive -Path EditorRoles.exe, LICENSE.txt -DestinationPath EditorRoles.zip
          $h = (Get-FileHash EditorRoles.exe -Algorithm SHA256).Hash.ToLower()
          "$h *EditorRoles.exe" | Out-File -Encoding ascii SHA256.txt
          Get-Content SHA256.txt

      - name: Sello de origen (este .exe salió de este código, compilado por GitHub)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: EditorRoles.exe

      - name: Guardar el resultado de la prueba
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: EditorRoles-prueba
          path: |
            EditorRoles.exe
            SHA256.txt

      - name: Publicar el Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = (Get-Content SHA256.txt).Split(' ')[0]
          $notas = @"
          ## Editor de roles SA-MP $env:GITHUB_REF_NAME

          **Compilado por GitHub** a partir de este código (no en la PC de nadie), con sello de origen verificable.

          ### Cómo usarlo
          1. Bajá **EditorRoles.exe** (o el .zip).
          2. Doble clic. **No se instala nada.** Requiere Windows 10 u 11. **No usa internet.**

          ¿Windows dice «Windows protegió su PC»? Es porque no tiene firma digital paga: **Más información → Ejecutar de todas formas**.

          ### Verificá que es el original
          SHA256: ``$h``

          Y que lo compiló GitHub desde este repositorio (con la herramienta gh):
          ``gh attestation verify EditorRoles.exe --repo $env:GITHUB_REPOSITORY``

          Hecho por **Knxyv** · ¿Sugerencias? Discord **@knvyv** o un Issue.
          "@
          $notas | Out-File -Encoding utf8 notas.md
          gh release create $env:GITHUB_REF_NAME EditorRoles.exe EditorRoles.zip SHA256.txt --title "Editor de roles SA-MP $env:GITHUB_REF_NAME" --notes-file notas.md
